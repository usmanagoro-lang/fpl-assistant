name: Update FPL page
on:
  schedule:
    - cron: "17 6 * * *"     # every morning
    - cron: "43 17 * * 4,5"  # Thu/Fri evening, before most deadlines
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fpl.py
        env:
          FPL_TEAM_ID: "4733331"
      - name: Save prediction history
        run: |
          git config user.name "fpl-assistant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/predictions.json
          git diff --cached --quiet || (git commit -m "Update prediction history" && git push)
      - name: Save page snapshot to 'page' branch
        run: |
          cp -r site /tmp/site
          cd /tmp/site
          git init -q -b page
          git config user.name "fpl-assistant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Page snapshot"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" page
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
